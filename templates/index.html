<script>

function isWustlEmail(value) {
  return typeof value === 'string' && /^[^@\s]+@wustl\.edu$/i.test(value.trim());
}
function getSavedEmail() {
  try { return localStorage.getItem('paws_email') || ''; } catch { return ''; }
}
function saveEmailLocal(value) {
  try { localStorage.setItem('paws_email', value.trim()); } catch {}
}
function removeEmailLocal() {
  try { localStorage.removeItem('paws_email'); } catch {}
}




document.addEventListener('DOMContentLoaded', function() {
  socket.emit('join_mode', { mode: mode, user_id: userId });
  loadItems();

  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadItems, 200);
  });

  if (mode === 'seeker') {
  const emailRow = document.getElementById('emailRow');
  const emailInput = document.getElementById('seekerEmail');
  const emailHelp = document.getElementById('emailHelp');
  const saveBtn = document.getElementById('saveEmailBtn');
  const removeBtn = document.getElementById('removeEmailBtn');

  emailRow.style.display = 'block';
  const existing = getSavedEmail();
  if (existing) emailInput.value = existing;

  saveBtn.addEventListener('click', () => {
    const val = emailInput.value.trim();
    if (!isWustlEmail(val)) {
      emailHelp.textContent = 'Please enter a valid @wustl.edu email.';
      emailHelp.classList.add('error');
      showNotification('Invalid email. Must end with @wustl.edu', 'error');
      return;
    }
    emailHelp.textContent = 'Saved.';
    emailHelp.classList.remove('error');
    saveEmailLocal(val);
    showNotification('Email saved', 'success');
  });

  removeBtn.addEventListener('click', () => {
    emailInput.value = '';
    removeEmailLocal();
    emailHelp.textContent = 'Removed.';
    emailHelp.classList.remove('error');
    showNotification('Email removed', 'success');
  });
}

});

function askForItem(itemKey, btnEl) {
  const item = items[itemKey];
  if (!item) return;

  if (btnEl) { btnEl.disabled = true; setTimeout(() => { btnEl.disabled = false; }, 1500); }

  let seekerEmail = '';
  if (mode === 'seeker') {
    const emailVal = document.getElementById('seekerEmail').value.trim();
    if (emailVal && isWustlEmail(emailVal)) {
      seekerEmail = emailVal;
      saveEmailLocal(seekerEmail);
    }
  }

  fetch('/api/request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ item_name: item.name, seeker_id: userId, seeker_email: seekerEmail })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) showNotification('Asked for ' + item.name, 'success');
    else showNotification(data.error || 'Error', 'error');
  })
  .catch(() => showNotification('Error', 'error'));
}

//newscript again


    function openPendingModal() {
  refreshPending();
  document.getElementById('pendingModalBackdrop').classList.add('show');
}
function closePendingModal() {
  document.getElementById('pendingModalBackdrop').classList.remove('show');
}

function refreshPending() {
  fetch(`/api/pending-requests?hours=3`)
    .then(r => r.json())
    .then(list => renderPending(list))
    .catch(() => {
      document.getElementById('pendingList').innerHTML = '<div class="empty-state">Could not load pending requests.</div>';
    });
}

function renderPending(list) {
  const el = document.getElementById('pendingList');
  if (!Array.isArray(list) || list.length === 0) {
    el.innerHTML = '<div class="empty-state">No pending requests in the last 3 hours.</div>';
    return;
  }
  el.innerHTML = list.map(r => {
    const age = timeAgo(r.created_at);
    const cat = (r.item && r.item.category) ? ` · ${r.item.category}` : '';
    // Buttons answer via your existing endpoint and will auto-remove from the list on refresh
    return `
      <div class="req-card">
        <div class="req-main">
          <div class="req-title">${r.item_name}</div>
          <div class="req-meta">${age}${cat}</div>
        </div>
        <div style="display:flex; gap:.4rem;">
          <button class="status-btn available" title="Mark Available" onclick="answerPending('${r.item_key}', true)">✓</button>
          <button class="status-btn unavailable" title="Mark Not Available" onclick="answerPending('${r.item_key}', false)">✗</button>
        </div>
      </div>
    `;
  }).join('');
}

function answerPending(itemKey, available) {
  // Use your existing update endpoint
  fetch(`/api/items/${itemKey}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ available: available, helper_id: userId })
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      showNotification('Updated', 'success');
      // Refresh list to remove the now-answered request(s)
      refreshPending();
      // Also keep the main list fresh
      loadItems();
    } else {
      showNotification(d.error || 'Error', 'error');
    }
  })
  .catch(() => showNotification('Error', 'error'));
}

// tiny "2m ago" helper (if not already present)
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  const s = Math.floor((Date.now() - t.getTime())/1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s/60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24);
  return `${d}d ago`;
}

window.openPendingModal = openPendingModal;
window.closePendingModal = closePendingModal;
window.refreshPending = refreshPending;
window.answerPending = answerPending;

    <script>
  // ... your existing globals ...
  let selectedCategory = localStorage.getItem('paws_category') || '';

  // (already defined) FALLBACK_CATEGORY and CATEGORY_TO_RECT_ID

  document.addEventListener('DOMContentLoaded', function() {
      socket.emit('join_mode', { mode: mode, user_id: userId });
      // attach listeners
      document.getElementById('searchInput').addEventListener('input', function() {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(loadItems, 200);
      });
      document.getElementById('categorySelect').addEventListener('change', function(e) {
          selectedCategory = e.target.value || '';
          localStorage.setItem('paws_category', selectedCategory);
          renderItems(); // re-render with new filter (no need to refetch)
      });

      loadItems();
  });

  // Build category options from items (with fallback if needed)
  function populateCategoryPicker() {
      const select = document.getElementById('categorySelect');
      const categories = new Set();

      // collect categories
      Object.values(items).forEach(it => {
          let cat = it.category;
          if (!cat) {
              const guess = FALLBACK_CATEGORY[it.name.toLowerCase()];
              if (guess) cat = guess;
          }
          if (cat) categories.add(cat);
      });

      // keep "All" at top, then sorted categories
      const current = selectedCategory;
      select.innerHTML = '<option value="">All</option>' +
          Array.from(categories).sort().map(c => {
              const sel = (c === current) ? ' selected' : '';
              return `<option value="${c}"${sel}>${c}</option>`;
          }).join('');
  }

  // Load items (unchanged), then populate picker
  function loadItems() {
      const search = document.getElementById('searchInput').value;
      fetch(`/api/items?search=${encodeURIComponent(search)}`)
          .then(response => response.json())
          .then(data => {
              items = data;
              populateCategoryPicker();   // << add this
              renderItems();
          })
          .catch(() => {
              itemsContainer.innerHTML = '<div class="empty-state">Could not load items.</div>';
          });
  }

  // Render items with category filter + alpha sort
  function renderItems() {
      const container = itemsContainer;
      // filter by category if chosen
      let entries = Object.entries(items).map(([key, it]) => {
          // derive category if missing
          const cat = it.category || FALLBACK_CATEGORY[it.name.toLowerCase()] || '';
          return [key, {...it, _cat: cat}];
      });

      if (selectedCategory) {
          entries = entries.filter(([, it]) => it._cat === selectedCategory);
      }

      // alpha sort by name within the filtered set
      entries.sort((a, b) => a[1].name.localeCompare(b[1].name));

      if (entries.length === 0) {
          container.innerHTML = '<div class="empty-state">No items found</div>';
          return;
      }

      const html = entries.map(([key, item]) => {
          let statusClass = 'unknown', statusSymbol = '?';
          if (item.available === true) { statusClass = 'available'; statusSymbol = '✓'; }
          else if (item.available === false) { statusClass = 'unavailable'; statusSymbol = '✗'; }

          const meta = item.category
  ? `<div class="item-meta">${item.category}</div>`
  : '';

          const actions = (mode === 'helper')
              ? `<div class="helper-controls">
                   <button class="status-btn available" onclick="updateStatus('${key}', true)">✓</button>
                   <button class="status-btn unavailable" onclick="updateStatus('${key}', false)">✗</button>
                 </div>`
              : `<button class="ask-btn" onclick="askForItem('${key}', this)">Ask</button>`;

          return `
            <div class="item">
              <div class="item-left">
                <div class="status-indicator ${statusClass}">${statusSymbol}</div>
                <div>
                  <div class="item-name">${item.name}</div>
                  ${meta}
                </div>
              </div>
              <div class="item-actions">${actions}</div>
            </div>
          `;
      }).join('');

      container.innerHTML = html;
  }
</script>

        // ---- Haptics + sound ----
let audioCtx = null;

function initAudioIfNeeded() {
  // Create/resume AudioContext on first user gesture to satisfy autoplay policies
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Call on any click/touch to unlock audio
window.addEventListener('click', initAudioIfNeeded, { once: false });
window.addEventListener('touchstart', initAudioIfNeeded, { once: false });

function playDing() {
  if (!audioCtx) return; // will play once user has interacted
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);     // A5
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.20);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.21);
}

function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(40); // short 40ms tap
  }
}

function notifyUserAttention() {
  vibrate();
  playDing();
}

// cut off here for script

        const mode = '{{ mode }}';
        const socket = io();
        const itemsContainer = document.getElementById('itemsContainer');

        // Stable anonymous user ID
        function getOrCreateId() {
          try {
            let id = localStorage.getItem('paws_uid');
            if (!id) {
              id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
              localStorage.setItem('paws_uid', id);
            }
            return id;
          } catch (e) {
            // Fallback if localStorage disabled
            return Math.random().toString(36).slice(2);
          }
        }
        const userId = getOrCreateId();

        let items = {};
        let searchTimeout;
        let pendingRequest = null; // { request_id, item_key, item_name }

        // Category → map rect ID mapping
        const CATEGORY_TO_RECT_ID = {
          "Produce": "map-Produce",
          "Dairy": "map-Dairy",
          "Bakery": "map-Bakery",
          "Meat & Poultry": "map-Meat & Poultry",
          "Pantry": "map-Pantry",
          "Beverages": "map-Beverages",
          "Frozen": "map-Frozen",
          "Snacks": "map-Snacks"
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            socket.emit('join_mode', { mode: mode, user_id: userId });
            loadItems();

            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(loadItems, 200);
            });
        });

        socket.on('new_request', function(data) {
  if (mode === 'helper') {
    notifyUserAttention(); // <— ding + tiny vibrate
    showNotification('Request: ' + data.item_name + ' (tap to open)', 'info', () => {
      openRequestModal({ request_id: data.request_id, item_key: data.item_key, item_name: data.item_name });
    });
  }
});

socket.on('request_answered', function(data) {
  if (mode === 'seeker') {
    notifyUserAttention(); // <— ding + tiny vibrate
    const status = data.available ? 'Available' : 'Not Available';
    showNotification(data.item.name + ' - ' + status, 'info');
  }
});

        // Socket events
        socket.on('mode_joined', function() {
            showNotification('Connected', 'success');
        });

        socket.on('item_updated', function(data) {
            items[data.item_key] = data.item;
            renderItems();
        });

        socket.on('new_request', function(data) {
            if (mode === 'helper') {
                // Make a clickable toast to open modal
                showNotification('Request: ' + data.item_name + ' (tap to open)', 'info', () => {
                    openRequestModal({ request_id: data.request_id, item_key: data.item_key, item_name: data.item_name });
                });
            }
        });

        socket.on('request_answered', function(data) {
            if (mode === 'seeker') {
                const status = data.available ? 'Available' : 'Not Available';
                showNotification(data.item.name + ' - ' + status, 'info');
            }
        });

        // Load items
        function loadItems() {
            const search = document.getElementById('searchInput').value;
            fetch(`/api/items?search=${encodeURIComponent(search)}`)
                .then(response => response.json())
                .then(data => {
                    items = data;
                    renderItems();
                })
                .catch(() => {
                    itemsContainer.innerHTML = '<div class="empty-state">Could not load items.</div>';
                });
        }

        // Render items
       function renderItems() {
  const container = itemsContainer;
  const entries = Object.entries(items).sort((a, b) => a[1].name.localeCompare(b[1].name));

  if (entries.length === 0) {
    container.innerHTML = '<div class="empty-state">No items found</div>';
    return;
  }

  const html = entries.map(([key, item]) => {
    let statusClass = 'unknown', statusSymbol = '?';
    if (item.available === true) { statusClass = 'available'; statusSymbol = '✓'; }
    else if (item.available === false) { statusClass = 'unavailable'; statusSymbol = '✗'; }

    const meta = item.category ? `<div class="item-meta">${item.category}</div>` : '';

    const actions = (mode === 'helper')
      ? `<div class="helper-controls">
           <button class="status-btn available" onclick="updateStatus('${key}', true)">✓</button>
           <button class="status-btn unavailable" onclick="updateStatus('${key}', false)">✗</button>
         </div>`
      : `<button class="ask-btn" onclick="askForItem('${key}', this)">Ask</button>`;

    return `
      <div class="item">
        <div class="item-left">
          <div class="status-indicator ${statusClass}">${statusSymbol}</div>
          <div>
            <div class="item-name">${item.name}</div>
            ${meta}
          </div>
        </div>
        <div class="item-actions">${actions}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = html;
}

        // Update status (helper mode)
        function updateStatus(itemKey, available) {
            fetch(`/api/items/${itemKey}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ available: available, helper_id: userId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadItems();
                    showNotification('Updated', 'success');
                } else {
                    showNotification('Error', 'error');
                }
            })
            .catch(() => showNotification('Error', 'error'));
        }

        // Notification (supports optional onClick for clickable toasts)
        function showNotification(message, type = 'info', onClick = null) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type + ' show';

            if (onClick) {
                notification.classList.add('clickable');
                notification.onclick = () => {
                    onClick();
                    notification.className = 'notification ' + type;
                    notification.onclick = null;
                };
            } else {
                notification.classList.remove('clickable');
                notification.onclick = null;
            }

            clearTimeout(notification._hideTimer);
            notification._hideTimer = setTimeout(() => {
                notification.className = 'notification ' + type;
                notification.onclick = null;
            }, onClick ? 6000 : 2500);
        }

        // Modal control
        function openRequestModal(req) {
  pendingRequest = req;

  document.getElementById('modalTitle').textContent = "New Request";
  document.getElementById('modalItemName').textContent = req.item_name;

  // Clear highlights
  document.querySelectorAll('.map-section').forEach(el => el.classList.remove('highlight'));

  // Use real category from API
  const item = items[req.item_key];
  const categoryName = item && item.category ? item.category : null;

  if (categoryName) {
    const rectId = CATEGORY_TO_RECT_ID[categoryName];
    const el = rectId ? document.getElementById(rectId) : null;
    if (el) el.classList.add('highlight');
  }

  document.getElementById('requestModalBackdrop').classList.add('show');
}

        function closeRequestModal() {
            document.getElementById('requestModalBackdrop').classList.remove('show');
            pendingRequest = null;
        }

        function submitRequestAnswer(available) {
            if (!pendingRequest) return;
            const key = pendingRequest.item_key;

            fetch(`/api/items/${key}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ available: available, helper_id: userId })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    showNotification('Updated', 'success');
                    loadItems();
                    closeRequestModal();
                } else {
                    showNotification('Error', 'error');
                }
            })
            .catch(() => showNotification('Error', 'error'));
        }

        // expose modal funcs if needed
        window.closeRequestModal = closeRequestModal;
        window.submitRequestAnswer = submitRequestAnswer;
        window.updateStatus = updateStatus;
        window.askForItem = askForItem;
    </script>
</body>
