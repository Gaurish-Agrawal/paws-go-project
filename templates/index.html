<script>


function initCategoryUI() {
  const categoryBtn  = document.getElementById('categoryBtn');
  const categoryMenu = document.getElementById('categoryMenu');
  const categoryChip = document.getElementById('categoryChip');

  if (!categoryBtn || !categoryMenu) return; // safety

  // Toggle dropdown
  categoryBtn.addEventListener('click', () => {
    const isHidden = categoryMenu.hasAttribute('hidden');
    if (isHidden) {
      categoryMenu.removeAttribute('hidden');
      categoryBtn.setAttribute('aria-expanded', 'true');
    } else {
      categoryMenu.setAttribute('hidden', '');
      categoryBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // Close when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.category-filter')) {
      if (!categoryMenu.hasAttribute('hidden')) {
        categoryMenu.setAttribute('hidden', '');
        categoryBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });

  // Save for chip updater
  window.__categoryChip = categoryChip;
}



function isWustlEmail(value) {
  return typeof value === 'string' && /^[^@\s]+@wustl\.edu$/i.test(value.trim());
}
function getSavedEmail() {
  try { return localStorage.getItem('paws_email') || ''; } catch { return ''; }
}
function saveEmailLocal(value) {
  try { localStorage.setItem('paws_email', value.trim()); } catch {}
}
function removeEmailLocal() {
  try { localStorage.removeItem('paws_email'); } catch {}
}




// === Category filter state ===
let currentCategory = '';

// Elements (created in HTML above)
const categoryBtn  = document.getElementById('categoryBtn');
const categoryMenu = document.getElementById('categoryMenu');
const categoryChip = document.getElementById('categoryChip');

// Toggle dropdown
categoryBtn?.addEventListener('click', () => {
  const isHidden = categoryMenu.hasAttribute('hidden');
  categoryMenu.toggleAttribute('hidden', !isHidden ? true : false);
  categoryBtn.setAttribute('aria-expanded', String(isHidden));
});

// Close when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.category-filter')) {
    if (!categoryMenu.hasAttribute('hidden')) {
      categoryMenu.setAttribute('hidden', '');
      categoryBtn.setAttribute('aria-expanded', 'false');
    }
  }
});

// Build menu from current items (call this after items load)
function buildCategoryMenuFromItems() {
  const categoryMenu = document.getElementById('categoryMenu');
  if (!categoryMenu) return;

  const cats = Array.from(
    new Set(Object.values(items || {}).map(it => it?.category).filter(Boolean))
  ).sort((a,b) => a.localeCompare(b));

  categoryMenu.innerHTML = [
    `<button role="option" data-cat="">All</button>`,
    ...cats.map(c => `<button role="option" data-cat="${c.replace(/"/g,'&quot;')}">${c}</button>`)
  ].join('');

  categoryMenu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCategory = btn.dataset.cat || '';
      updateCategoryChip();
      categoryMenu.setAttribute('hidden','');
      document.getElementById('categoryBtn').setAttribute('aria-expanded','false');
      renderItems();
    });
  });

  // Optional: re-select currentCategory if it still exists
  updateCategoryChip();
}

function updateCategoryChip() {
  const chip = window.__categoryChip || document.getElementById('categoryChip');
  if (!chip) return;
  if (currentCategory) {
    chip.hidden = false;
    chip.innerHTML = `${currentCategory} <span class="chip-x" title="Clear">✕</span>`;
    chip.querySelector('.chip-x').onclick = () => {
      currentCategory = '';
      updateCategoryChip();
      renderItems();
    };
  } else {
    chip.hidden = true;
    chip.textContent = '';
  }
}

function updateCategoryChip() {
  if (!categoryChip) return;
  if (currentCategory) {
    categoryChip.hidden = false;
    categoryChip.innerHTML = `${currentCategory} <span class="chip-x" title="Clear">✕</span>`;
    categoryChip.querySelector('.chip-x').onclick = () => {
      currentCategory = '';
      updateCategoryChip();
      renderItems();
    };
  } else {
    categoryChip.hidden = true;
    categoryChip.textContent = '';
  }
}

function askForItem(itemKey, btnEl) {
  const item = items[itemKey];
  if (!item) return;

  if (btnEl) { btnEl.disabled = true; setTimeout(() => { btnEl.disabled = false; }, 1500); }

  let seekerEmail = '';
  if (mode === 'seeker') {
    const emailVal = document.getElementById('seekerEmail').value.trim();
    if (emailVal && isWustlEmail(emailVal)) {
      seekerEmail = emailVal;
      saveEmailLocal(seekerEmail);
    }
  }

  fetch('/api/request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ item_name: item.name, seeker_id: userId, seeker_email: seekerEmail })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) showNotification('Asked for ' + item.name, 'success');
    else showNotification(data.error || 'Error', 'error');
  })
  .catch(() => showNotification('Error', 'error'));
}

    function openPendingModal() {
  refreshPending();
  document.getElementById('pendingModalBackdrop').classList.add('show');
}
function closePendingModal() {
  document.getElementById('pendingModalBackdrop').classList.remove('show');
}

function refreshPending() {
  fetch(`/api/pending-requests?hours=3`)
    .then(r => r.json())
    .then(list => renderPending(list))
    .catch(() => {
      document.getElementById('pendingList').innerHTML = '<div class="empty-state">Could not load pending requests.</div>';
    });
}

function renderPending(list) {
  const el = document.getElementById('pendingList');
  if (!Array.isArray(list) || list.length === 0) {
    el.innerHTML = '<div class="empty-state">No pending requests in the last 3 hours.</div>';
    return;
  }
  el.innerHTML = list.map(r => {
    const age = timeAgo(r.created_at);
    const cat = (r.item && r.item.category) ? ` · ${r.item.category}` : '';
    // Buttons answer via your existing endpoint and will auto-remove from the list on refresh
    return `
      <div class="req-card">
        <div class="req-main">
          <div class="req-title">${r.item_name}</div>
          <div class="req-meta">${age}${cat}</div>
        </div>
        <div style="display:flex; gap:.4rem;">
          <button class="status-btn available" title="Mark Available" onclick="answerPending('${r.item_key}', true)">✓</button>
          <button class="status-btn unavailable" title="Mark Not Available" onclick="answerPending('${r.item_key}', false)">✗</button>
        </div>
      </div>
    `;
  }).join('');
}

function answerPending(itemKey, available) {
  // Use your existing update endpoint
  fetch(`/api/items/${itemKey}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ available: available, helper_id: userId })
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      showNotification('Updated', 'success');
      // Refresh list to remove the now-answered request(s)
      refreshPending();
      // Also keep the main list fresh
      loadItems();
    } else {
      showNotification(d.error || 'Error', 'error');
    }
  })
  .catch(() => showNotification('Error', 'error'));
}

// tiny "2m ago" helper (if not already present)
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  const s = Math.floor((Date.now() - t.getTime())/1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s/60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24);
  return `${d}d ago`;
}

window.openPendingModal = openPendingModal;

            <div class="item-name">${item.name}</div>
            ${meta}
          </div>
        </div>
        <div class="item-actions">${actions}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = html;
}
</script>

  const nextBtn = modal.querySelector('#miniNext');

  let i = 0, lastFocus = null;

  function renderDots(){
    dotsEl.innerHTML = '';
    SLIDES.forEach((_, k) => {
      const d = document.createElement('button');
      d.className = 'mini-modal__dot';
      if (k === i) d.setAttribute('aria-current','true');

  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });

  // Nav
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
})();

        // ---- Haptics + sound ----
let audioCtx = null;

function initAudioIfNeeded() {
  // Create/resume AudioContext on first user gesture to satisfy autoplay policies
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Call on any click/touch to unlock audio
window.addEventListener('click', initAudioIfNeeded, { once: false });
window.addEventListener('touchstart', initAudioIfNeeded, { once: false });

function playDing() {
  if (!audioCtx) return; // will play once user has interacted
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);     // A5
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.20);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.21);
}

function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(40); // short 40ms tap
  }
}

function notifyUserAttention() {
  vibrate();
  playDing();
}

        // Notification (supports optional onClick for clickable toasts)
        function showNotification(message, type = 'info', onClick = null) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type + ' show';

            if (onClick) {
                notification.classList.add('clickable');
                notification.onclick = () => {
                    onClick();
                    notification.className = 'notification ' + type;
                    notification.onclick = null;
                };
            } else {
                notification.classList.remove('clickable');
                notification.onclick = null;
            }

            clearTimeout(notification._hideTimer);
            notification._hideTimer = setTimeout(() => {
                notification.className = 'notification ' + type;
                notification.onclick = null;
            }, onClick ? 6000 : 2500);
